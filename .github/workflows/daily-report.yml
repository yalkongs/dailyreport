name: Generate Daily Market Report
# Runs at 06:30 KST on weekdays. Two sequential jobs:
#   1. `market` — global market report (existing pipeline)
#   2. `etf`    — ETF morning report (absorbed from etfreport)
# The jobs are independent: if `market` fails, `etf` still runs.
# Only the ordering is preserved so Telegram pushes arrive in a
# predictable order (market first, then ETF).

on:
  schedule:
    # 늦은 백업 트리거 — KST 07:30 (월~금) = UTC 22:30 (일~목).
    # 정시 트리거는 cron-job.org(06:40 KST)가 workflow_dispatch로 담당.
    # cron-job.org가 죽은 날에만 이 백업이 의미 있음. 06:40 발화와 시각이
    # 분리돼 push 충돌 레이스가 원천 차단됨 (README "아침 트리거" 참조).
    # ⚠️ 자정(24:00 UTC) 넘기면 UTC 요일이 하루 밀려 0-4(=KST 월~금) 매핑이
    #    깨진다. 22:30 UTC는 안전. 이후 수정 시 이 경계를 반드시 지킬 것.
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '테스트 실행 (텔레그램 발송 안 함, commit 안 함)'
        required: false
        type: boolean
        default: false
      force_regenerate:
        description: '오늘 자 리포트가 이미 있어도 강제 재생성'
        required: false
        type: boolean
        default: false
      only:
        description: '실행 대상 (market | etf | both)'
        required: false
        type: choice
        options: [both, market, etf]
        default: both
      resend_telegram_only:
        description: '오늘 자 기존 리포트로 Telegram만 재발송 (생성 스킵)'
        required: false
        type: boolean
        default: false

env:
  TZ: Asia/Seoul

permissions:
  contents: write
  statuses: write  # Vercel 배포 상태 읽기 + Telegram 발송 상태(telegram/market·etf) 기록

jobs:
  market:
    if: ${{ inputs.only != 'etf' }}
    runs-on: ubuntu-latest
    # 20분: JSON 파싱 안전망(claude-client.ts)이 최대 3회 재생성할 여유 확보.
    # 정상 실행은 ~4~5분이라 평소엔 영향 없음.
    # 15→20 (2026-08-18): 글꼴 설치가 상한 5분을 다 쓰면 15분으론 리포트 생성
    # 여유가 남지 않는다. 아래 글꼴 step 주석의 인시던트 참조.
    timeout-minutes: 20
    # 같은 종류의 job은 실행(run) 간에도 직렬로 — 정시·2차·3순위·수동 실행이 겹쳐도 뒤 실행이
    # 앞 실행의 커밋과 발송 상태를 반드시 보게 한다. 진행 중 실행은 취소하지 않는다.
    concurrency:
      group: daily-report-market
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 재실행(re-run)은 트리거 시점 SHA를 잡는다. 그사이 etf job이 push해
          # main이 앞서가면 push가 non-fast-forward로 거부된다(2026-08-07 인시던트).
          # etf job과 동일하게 항상 최신 main을 체크아웃한다.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Korean fonts (runner has no CJK fonts by default)
        # ⚠️ 2026-08-18 인시던트: `apt-get update`가 출력 한 줄 없이 ~14분 50초
        # 멈춰 job의 timeout-minutes를 통째로 먹었다. 리포트 생성 step에
        # 도달하지도 못한 채 job이 취소돼 그날 마켓 리포트가 발송되지 않았다.
        # (같은 step이 3분 뒤 etf job에서는 15초에 끝났다 — 미러/네트워크 일시 장애.)
        # 각 시도를 timeout으로 묶어 멈춘 미러를 죽이고 재시도한다. step 자체에도
        # 상한을 둬, 최악의 경우에도 job 예산의 1/4만 쓰게 한다.
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            if sudo timeout -k 10 90 apt-get update -qq \
               && sudo timeout -k 10 120 apt-get install -y -qq fonts-noto-cjk; then
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::error::fonts-noto-cjk 설치 3회 실패 — CJK 글꼴 없이는 프리뷰 PNG가 깨진다"
              exit 1
            fi
            echo "::warning::apt-get 지연/실패 — 재시도 ${i}/3"
            sleep 10
          done
          fc-cache -f
          fc-list :lang=ko | head -3

      - name: Generate market report
        id: report
        if: ${{ inputs.resend_telegram_only != true && inputs.resend_telegram_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DISABLE_CONTEXT: ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && 'false' || 'false' }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate == true && 'true' || 'false' }}
        run: |
          npx tsx scripts/run.ts
          REPORT_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "date=${REPORT_DATE}" >> $GITHUB_OUTPUT
          # reports-index.json에서 헤드라인 추출
          HEADLINE=$(node -e "const i=JSON.parse(require('fs').readFileSync('data/reports-index.json','utf-8'));const r=i.reports.find(r=>r.date==='${REPORT_DATE}');console.log(r?.headline||'오늘의 시장 리포트')")
          echo "headline=${HEADLINE}" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: changes
        if: ${{ inputs.resend_telegram_only != true && inputs.resend_telegram_only != 'true' }}
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push report
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REPORT_DATE=${{ steps.report.outputs.date }}
          git add public/reports/ data/
          git commit -m "Daily Market Report - ${REPORT_DATE} (KST)"
          # ⚠️ rebase는 반드시 commit **뒤**에 온다. git add 앞에 두면 작업 트리가
          # 더러워 매번 "cannot pull with rebase: You have unstaged changes"(exit 128)로
          # 거부되고 `|| true`가 이를 삼킨다 — 이 스텝의 발동 조건(changed=='true')이
          # 더러운 트리를 보장하므로 구조적으로 실행 불가능해진다.
          git pull --rebase origin main || true
          git push

      - name: Resolve delivery (보낼지 판정 — 발송 상태는 리포트 커밋의 commit status)
        id: delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          FORCE_RESEND: ${{ (inputs.resend_telegram_only == true || inputs.resend_telegram_only == 'true') && 'true' || 'false' }}
          DRY_RUN: ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && 'true' || 'false' }}
        run: npx tsx scripts/delivery-state.ts resolve market

      - name: Wait for Vercel deployment (poll commit status until success)
        if: steps.delivery.outputs.action == 'send'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 고정 sleep 대신 실제 배포 완료를 확인한 뒤 텔레그램을 보낸다.
          # (content-type=image/png 확인만으론 부족 — 미배포 시 og:image fallback이
          #  /api/og(과거 그린)를 같은 png로 반환해 깨진 카드가 나갔던 인시던트.)
          # Vercel은 push된 커밋의 commit status(context=Vercel)로 배포 결과를 보고한다.
          # 이 폴링이 job을 직렬화해 다음 job의 push가 이 배포를 취소하는 race도 막는다.
          SHA=$(git rev-parse HEAD)
          echo "Vercel 배포 대기: ${GITHUB_REPOSITORY}@${SHA}"
          for i in $(seq 1 60); do
            # 2>&1: API 실패를 STATE로 받아 로그에 노출(과거엔 pending으로 삼켜 403을
            # 느린 빌드로 오인했음). success/failure/error/pending 외 값은 비정상 응답.
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" \
              --jq '[.statuses[] | select(.context == "Vercel")] | (first.state // "pending")' 2>&1)
            echo "  [${i}/60] Vercel: ${STATE}"
            case "${STATE}" in
              success) echo "✅ Vercel 배포 완료 — 텔레그램 발송 진행"; exit 0 ;;
              failure|error) echo "::error::Vercel 배포 실패(${STATE}) — 텔레그램 발송 중단"; exit 1 ;;
              pending) ;;  # 빌드 중 — 계속 대기
              *) echo "  ⚠️ status 조회 비정상(statuses 권한/네트워크 확인) — 재시도" ;;
            esac
            sleep 10
          done
          echo "::error::Vercel 배포 미확인 10분 — 깨진 카드 방지 위해 발송 중단"
          exit 1

      - name: Send Telegram notification
        if: steps.delivery.outputs.action == 'send'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_DATE: ${{ steps.delivery.outputs.date }}
          REPORT_SHA: ${{ steps.delivery.outputs.sha }}
          HEADLINE: ${{ steps.delivery.outputs.headline }}
          IS_RESEND: ${{ steps.delivery.outputs.resend }}
          FORCE_RESEND: ${{ (inputs.resend_telegram_only == true || inputs.resend_telegram_only == 'true') && 'true' || 'false' }}
        run: |
          # 발송 직전 재확인 — 수동 re-run·겹친 실행 방어. 이 실행이 방금 생성한 리포트
          # (IS_RESEND=false)는 아직 발송됐을 수 없으므로 건너뛰고, 사람의 명시적 재발송도 우회한다.
          if [ "$IS_RESEND" = "true" ] && [ "$FORCE_RESEND" != "true" ]; then
            CURRENT=$(npx tsx scripts/delivery-state.ts status market "$REPORT_SHA" | tail -1)
            case "$CURRENT" in
              none|failure) ;;
              success|pending)
                echo "발송 생략: 현재 status=${CURRENT} (success=이미 발송, pending=다른 실행이 발송 중이거나 결과 불명)"
                exit 0 ;;
              *)
                # 조회 실패를 조용히 넘기면 job은 녹색인데 아무것도 안 나간다 — 실패로 알린다.
                echo "::error::발송 상태 재확인 실패(status=${CURRENT}) — 보내지 않았습니다. status가 없으므로 다음 실행이 복구합니다."
                exit 1 ;;
            esac
          fi
          REPORT_URL="https://dailyreport-eta.vercel.app/reports/${REPORT_DATE}"
          # Cache-bust only in resend mode — Telegram caches images by URL,
          # so we need a unique URL if the PNG on Vercel was updated after
          # a previous Telegram fetch.
          if [ "$IS_RESEND" = "true" ]; then
            OG_IMAGE_URL="https://dailyreport-eta.vercel.app/reports/${REPORT_DATE}-preview.png?v=${GITHUB_RUN_ID}"
          else
            OG_IMAGE_URL="https://dailyreport-eta.vercel.app/reports/${REPORT_DATE}-preview.png"
          fi

          # 날짜 포맷 (예: 4월 13일 월요일)
          FORMATTED_DATE=$(TZ=Asia/Seoul date +"%m월 %d일 %A" | sed 's/Monday/월요일/;s/Tuesday/화요일/;s/Wednesday/수요일/;s/Thursday/목요일/;s/Friday/금요일/')

          # parse_mode=HTML caption: bare &,<,> 는 invalid entity → escape 안 하면 ok:false
          # (헤드라인 데이터는 정규화된 평문 "S&P" 이므로 caption용으로 HTML escape 필요).
          HEADLINE_HTML=$(printf '%s' "$HEADLINE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          MESSAGE=$(printf '<b>iM AI Market Report</b>\n\n<b>%s</b>\n\n%s\n\n<a href="%s">리포트 보기</a>' "$HEADLINE_HTML" "$FORMATTED_DATE" "$REPORT_URL")

          # --form-string: value는 리터럴로 처리 (caption이 '<'로 시작하면
          # -F는 "파일에서 읽기"로 오해해 exit 26 낸다. 이모지 제거로 노출됨)
          # 발송 직전에 pending을 먼저 기록한다 — 발송 뒤 결과 기록에 실패해도 다음 실행이
          # '결과 불명'으로 보고 재발송하지 않게. pending 기록에 실패하면 보내지 않는다.
          npx tsx scripts/delivery-state.ts mark market "$REPORT_SHA" pending "Telegram 발송 시도 중"

          RESPONSE=$(curl -s --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "photo=${OG_IMAGE_URL}" \
            --form-string "caption=${MESSAGE}" \
            --form-string "parse_mode=HTML" || true)

          CLASSIFIED=$(printf '%s' "$RESPONSE" | npx tsx scripts/delivery-state.ts classify)
          STATE=$(printf '%s\n' "$CLASSIFIED" | sed -n 1p)
          DETAIL=$(printf '%s\n' "$CLASSIFIED" | sed -n 2p)
          echo "Telegram: ${STATE} — ${DETAIL}"
          npx tsx scripts/delivery-state.ts mark market "$REPORT_SHA" "$STATE" "$DETAIL" || {
            echo "::error::Telegram ${STATE} 이후 상태 기록 실패 — status는 pending으로 남아 자동 재발송되지 않습니다. 수동 재발송 전에 반드시 구독자 채널을 확인하십시오."
            exit 1
          }
          if [ "$STATE" != "success" ]; then
            echo "::error::Telegram 발송 ${STATE} — ${DETAIL}"
            exit 1
          fi

  etf:
    needs: market
    if: ${{ always() && inputs.only != 'market' }}
    runs-on: ubuntu-latest
    # 10→15 (2026-08-18): 글꼴 설치 상한 5분 + ETF 파이프라인 ~3분에 여유를 둔다.
    timeout-minutes: 15
    # 같은 종류의 job은 실행(run) 간에도 직렬로 — 정시·2차·3순위·수동 실행이 겹쳐도 뒤 실행이
    # 앞 실행의 커밋과 발송 상태를 반드시 보게 한다. 진행 중 실행은 취소하지 않는다.
    concurrency:
      group: daily-report-etf
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Korean fonts (runner has no CJK fonts by default)
        # market job의 같은 step과 동일한 방어 — 2026-08-18 인시던트 주석 참조.
        # 이 job은 예산이 더 빠듯해(15분) 멈춘 apt에 오히려 더 취약하다.
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            if sudo timeout -k 10 90 apt-get update -qq \
               && sudo timeout -k 10 120 apt-get install -y -qq fonts-noto-cjk; then
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::error::fonts-noto-cjk 설치 3회 실패 — CJK 글꼴 없이는 프리뷰 PNG가 깨진다"
              exit 1
            fi
            echo "::warning::apt-get 지연/실패 — 재시도 ${i}/3"
            sleep 10
          done
          fc-cache -f

      - name: Run ETF pipeline
        id: etf
        if: ${{ inputs.resend_telegram_only != true && inputs.resend_telegram_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          ETF_PUBLIC_BASE_URL: https://dailyreport-eta.vercel.app
        run: |
          npx tsx scripts/run-etf.ts
          REPORT_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "date=${REPORT_DATE}" >> $GITHUB_OUTPUT
          HEADLINE=$(node -e "const i=JSON.parse(require('fs').readFileSync('data/etf-reports-index.json','utf-8'));const r=i.reports.find(r=>r.date==='${REPORT_DATE}');console.log(r?.headline||'오늘의 ETF 리포트')")
          ANOMALY_COUNT=$(node -e "const i=JSON.parse(require('fs').readFileSync('data/etf-reports-index.json','utf-8'));const r=i.reports.find(r=>r.date==='${REPORT_DATE}');console.log(r?.anomalyCount||0)")
          # Breakdown: "괴리율 2/거래량 1/매도 1" 형태. 0건은 빈 문자열.
          ANOMALY_BREAKDOWN=$(node -e "const L={premiumDiscount:'괴리율',trackingError:'추적오차',volumeSpike:'거래량',consecutiveSell:'매도'};const i=JSON.parse(require('fs').readFileSync('data/etf-reports-index.json','utf-8'));const r=i.reports.find(r=>r.date==='${REPORT_DATE}');const b=r?.anomalyBreakdown||{};const s=Object.entries(b).filter(([,c])=>c>0).map(([t,c])=>(L[t]||t)+' '+c).join('/');console.log(s)")
          echo "headline=${HEADLINE}" >> $GITHUB_OUTPUT
          echo "anomaly_count=${ANOMALY_COUNT}" >> $GITHUB_OUTPUT
          echo "anomaly_breakdown=${ANOMALY_BREAKDOWN}" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: changes
        if: ${{ inputs.resend_telegram_only != true && inputs.resend_telegram_only != 'true' }}
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push ETF report
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REPORT_DATE=${{ steps.etf.outputs.date }}
          git add public/etf-reports/ data/
          git commit -m "ETF Daily Report - ${REPORT_DATE} (KST)"
          # Pull any market-job commit that landed during this run so we
          # don't race-fail on push.
          # ⚠️ commit **뒤**에 와야 한다. git add 앞에 있던 2026-04-18~2026-08-09
          # 배치에서는 더러운 트리 때문에 매번 exit 128로 거부되고 `|| true`가
          # 삼켜, 16주간 한 번도 실행되지 않았다.
          git pull --rebase origin main || true
          git push

      - name: Resolve delivery (보낼지 판정 — 발송 상태는 리포트 커밋의 commit status)
        id: delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          FORCE_RESEND: ${{ (inputs.resend_telegram_only == true || inputs.resend_telegram_only == 'true') && 'true' || 'false' }}
          DRY_RUN: ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && 'true' || 'false' }}
        run: npx tsx scripts/delivery-state.ts resolve etf

      - name: Wait for Vercel deployment (poll commit status until success)
        if: steps.delivery.outputs.action == 'send'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 고정 sleep 대신 실제 배포 완료를 확인한 뒤 텔레그램을 보낸다.
          # (content-type=image/png 확인만으론 부족 — 미배포 시 og:image fallback이
          #  /api/og(과거 그린)를 같은 png로 반환해 깨진 카드가 나갔던 인시던트.)
          # Vercel은 push된 커밋의 commit status(context=Vercel)로 배포 결과를 보고한다.
          # 이 폴링이 job을 직렬화해 다음 job의 push가 이 배포를 취소하는 race도 막는다.
          SHA=$(git rev-parse HEAD)
          echo "Vercel 배포 대기: ${GITHUB_REPOSITORY}@${SHA}"
          for i in $(seq 1 60); do
            # 2>&1: API 실패를 STATE로 받아 로그에 노출(과거엔 pending으로 삼켜 403을
            # 느린 빌드로 오인했음). success/failure/error/pending 외 값은 비정상 응답.
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" \
              --jq '[.statuses[] | select(.context == "Vercel")] | (first.state // "pending")' 2>&1)
            echo "  [${i}/60] Vercel: ${STATE}"
            case "${STATE}" in
              success) echo "✅ Vercel 배포 완료 — 텔레그램 발송 진행"; exit 0 ;;
              failure|error) echo "::error::Vercel 배포 실패(${STATE}) — 텔레그램 발송 중단"; exit 1 ;;
              pending) ;;  # 빌드 중 — 계속 대기
              *) echo "  ⚠️ status 조회 비정상(statuses 권한/네트워크 확인) — 재시도" ;;
            esac
            sleep 10
          done
          echo "::error::Vercel 배포 미확인 10분 — 깨진 카드 방지 위해 발송 중단"
          exit 1

      - name: Send ETF Telegram notification
        if: steps.delivery.outputs.action == 'send'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_DATE: ${{ steps.delivery.outputs.date }}
          REPORT_SHA: ${{ steps.delivery.outputs.sha }}
          HEADLINE: ${{ steps.delivery.outputs.headline }}
          IS_RESEND: ${{ steps.delivery.outputs.resend }}
          FORCE_RESEND: ${{ (inputs.resend_telegram_only == true || inputs.resend_telegram_only == 'true') && 'true' || 'false' }}
          ANOMALY_COUNT: ${{ steps.delivery.outputs.anomaly_count }}
          ANOMALY_BREAKDOWN: ${{ steps.delivery.outputs.anomaly_breakdown }}
        run: |
          # 발송 직전 재확인 — 수동 re-run·겹친 실행 방어. 이 실행이 방금 생성한 리포트
          # (IS_RESEND=false)는 아직 발송됐을 수 없으므로 건너뛰고, 사람의 명시적 재발송도 우회한다.
          if [ "$IS_RESEND" = "true" ] && [ "$FORCE_RESEND" != "true" ]; then
            CURRENT=$(npx tsx scripts/delivery-state.ts status etf "$REPORT_SHA" | tail -1)
            case "$CURRENT" in
              none|failure) ;;
              success|pending)
                echo "발송 생략: 현재 status=${CURRENT} (success=이미 발송, pending=다른 실행이 발송 중이거나 결과 불명)"
                exit 0 ;;
              *)
                # 조회 실패를 조용히 넘기면 job은 녹색인데 아무것도 안 나간다 — 실패로 알린다.
                echo "::error::발송 상태 재확인 실패(status=${CURRENT}) — 보내지 않았습니다. status가 없으므로 다음 실행이 복구합니다."
                exit 1 ;;
            esac
          fi
          REPORT_URL="https://dailyreport-eta.vercel.app/etf-reports/${REPORT_DATE}"

          # 날짜 포맷 (예: 4월 20일 월요일)
          FORMATTED_DATE=$(TZ=Asia/Seoul date +"%m월 %d일 %A" | sed 's/Monday/월요일/;s/Tuesday/화요일/;s/Wednesday/수요일/;s/Thursday/목요일/;s/Friday/금요일/')

          # 이상 탐지 알림 라인 (0건이면 생략, breakdown 있으면 분류 표기)
          ALERT_LINE=""
          if [ "${ANOMALY_COUNT}" -gt 0 ] 2>/dev/null; then
            if [ -n "${ANOMALY_BREAKDOWN}" ]; then
              ALERT_LINE=$'\n이상 탐지: '"${ANOMALY_COUNT}"'건 ('"${ANOMALY_BREAKDOWN}"')'
            else
              ALERT_LINE=$'\n이상 탐지: '"${ANOMALY_COUNT}"'건'
            fi
          fi

          # parse_mode=HTML caption: bare &,<,> 는 invalid entity → escape 안 하면 ok:false
          # (ETF 헤드라인은 claude JSON 평문 그대로라 caption용 HTML escape 필요).
          HEADLINE_HTML=$(printf '%s' "$HEADLINE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          MESSAGE=$(printf '<b>iM AI ETF Report</b>\n\n<b>%s</b>%s\n\n%s\n\n<a href="%s">리포트 보기</a>' "$HEADLINE_HTML" "$ALERT_LINE" "$FORMATTED_DATE" "$REPORT_URL")

          # Static preview PNG generated by scripts/run-etf.ts. We attach
          # it explicitly via sendPhoto so Telegram's preview cache trap
          # (cached "no preview" on first 404) cannot strike.
          if [ "$IS_RESEND" = "true" ]; then
            OG_IMAGE_URL="https://dailyreport-eta.vercel.app/etf-reports/${REPORT_DATE}-preview.png?v=${GITHUB_RUN_ID}"
          else
            OG_IMAGE_URL="https://dailyreport-eta.vercel.app/etf-reports/${REPORT_DATE}-preview.png"
          fi

          # 발송 직전에 pending을 먼저 기록한다 — 발송 뒤 결과 기록에 실패해도 다음 실행이
          # '결과 불명'으로 보고 재발송하지 않게. pending 기록에 실패하면 보내지 않는다.
          npx tsx scripts/delivery-state.ts mark etf "$REPORT_SHA" pending "Telegram 발송 시도 중"

          RESPONSE=$(curl -s --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "photo=${OG_IMAGE_URL}" \
            --form-string "caption=${MESSAGE}" \
            --form-string "parse_mode=HTML" || true)

          CLASSIFIED=$(printf '%s' "$RESPONSE" | npx tsx scripts/delivery-state.ts classify)
          STATE=$(printf '%s\n' "$CLASSIFIED" | sed -n 1p)
          DETAIL=$(printf '%s\n' "$CLASSIFIED" | sed -n 2p)
          echo "Telegram: ${STATE} — ${DETAIL}"
          npx tsx scripts/delivery-state.ts mark etf "$REPORT_SHA" "$STATE" "$DETAIL" || {
            echo "::error::Telegram ${STATE} 이후 상태 기록 실패 — status는 pending으로 남아 자동 재발송되지 않습니다. 수동 재발송 전에 반드시 구독자 채널을 확인하십시오."
            exit 1
          }
          if [ "$STATE" != "success" ]; then
            echo "::error::Telegram 발송 ${STATE} — ${DETAIL}"
            exit 1
          fi

  # KRX OpenAPI 전일 데이터 게시 시각 관측 (읽기 전용, 임시).
  # 매일 06:40 KST 정시 dispatch(cron-job.org, only=both)에 편승해 09:10 KST까지
  # 5분 간격으로 조회하고 로그만 남긴다. market·etf job과 무관하며 리포트에 영향이 없다.
  # 백업 schedule에 편승하지 않는 이유: GitHub schedule 지연으로 2026-08-27 이후 실제
  # 발화가 09:07~10:20 KST라 관측 구간(~09:10)이 통째로 지나간다.
  # 수동 dispatch(dry_run·resend·only=market|etf)에서는 돌지 않는다.
  # 3~5거래일 관측 후 이 job과 scripts/probe-krx-publish.ts를 제거한다.
  # spec: docs/superpowers/specs/2026-09-20-etf-data-accuracy-design.md
  krx-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.only == 'both' && inputs.dry_run != true && inputs.dry_run != 'true' && inputs.resend_telegram_only != true && inputs.resend_telegram_only != 'true' }}
    runs-on: ubuntu-latest
    # 06:40 시작 → 09:10 마감 + 마지막 5분 대기 = 최대 ~155분.
    timeout-minutes: 170

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Probe KRX publish time
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: npx tsx scripts/probe-krx-publish.ts
