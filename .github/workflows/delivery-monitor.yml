name: Delivery Monitor
# 독립 도착 감시(감사 F06) — 영업일 아침 리포트가 구독자에게 실제로 발송(telegram/<kind>=success)됐는지
# 확인한다. 생성 workflow(daily-report.yml)가 아예 돌지 않은 날(트리거 누락 — job 실패 메일조차 없음)과
# 돌았지만 미발송으로 끝난 날을 모두 잡는다. 이 job이 실패하면 GitHub가 저장소 소유자에게 메일을 보낸다.
# 한국 휴장일은 통과(파이프라인 silent skip과 같은 기준). 판정은 scripts/check-delivery.ts.
# 읽기 전용 — 발송·재발송·status 기록을 하지 않는다(중복 발송 방지 정책은 daily-report.yml 쪽 그대로).
#
# 발행물 정확성 검사(2026-10-23): 발송 확인 다음에 공개 페이지(코스피 줄무늬·핵심 지표·제목 수치·예시 ETF·모자이크·
# 미리보기 메타)를 Yahoo 원천 시세와 대조한다(scripts/check-published.ts). 발송 확인이 실패해도 돈다(if: always()) —
# 틀린 내용이 나간 날도, 안 나간 날도 같은 실패 메일로 알린다. 한국 장이 열린 뒤(schedule 지연 실행)에는
# 한국 시세 대조만 SKIP("장중 — 직전 거래일 시세 아님"), 미국 대조와 시세 무관 검사는 그대로.
#
# 트리거(2026-10-19 개편 — 두 리포트가 08:00 전에 함께 발송되므로 감시도 하나로 합쳤다):
#   - 정시 감시: 맥미니 launchd(ops/macmini/monitor.sh)가 07:45 KST에 kind=all로 dispatch.
#   - schedule: 늦은 백업. GitHub schedule은 만성 지연(관측상 수 시간)이라 정시 보장이 아니다 —
#     맥미니가 죽은 날에도 그날 안에는 경보가 나게 하는 용도. 두 리포트(all)를 본다.

on:
  schedule:
    # KST 07:45 월~금 = UTC 22:45 일~목 → all(market·etf)
    # ⚠️ 자정(24:00 UTC)을 넘기면 UTC 요일이 하루 밀려 0-4(=KST 월~금) 매핑이 깨진다.
    - cron: '45 22 * * 0-4'
  workflow_dispatch:
    inputs:
      kind:
        description: '감시 대상 (all = 마켓·ETF 둘 다 | market | etf)'
        required: true
        type: choice
        options: [all, market, etf]
        default: all

env:
  TZ: Asia/Seoul

permissions:
  contents: read   # main 커밋 목록 조회(오늘 리포트 커밋 찾기)
  statuses: read   # telegram/<kind> commit status 조회

jobs:
  check:
    # 러너 이미지 고정 — 기본 이미지가 Ubuntu 26으로 바뀌는 시점(2026-10-19~)과 개편이 겹치지 않게(spec §9).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check delivery (영업일인데 발송 success가 아니면 실패)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ github.event_name == 'schedule' && 'all' || inputs.kind }}
        run: npx tsx scripts/check-delivery.ts "$KIND"

      - name: Check published content (공개 페이지 수치·날짜가 원천 시세와 다르면 실패)
        if: always()
        env:
          KIND: ${{ github.event_name == 'schedule' && 'all' || inputs.kind }}
        run: npx tsx scripts/check-published.ts --kind "$KIND"
